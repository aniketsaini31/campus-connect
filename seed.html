<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Load Demo Data - Campus Connect</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/pages.css">
  <link rel="stylesheet" href="css/forms.css">
  <style>[hidden]{display:none !important} #seedMsg{margin-bottom:18px}</style>
</head>
<body>

  <header class="navbar">
    <div class="container nav-inner">
      <a href="index.html" class="brand">
        <span class="brand-mark">🔎</span>
        <span>Campus Connect</span>
      </a>
      <button class="nav-toggle" id="navToggle" aria-label="Open menu" aria-expanded="false">☰</button>
      <nav class="nav-links" id="navLinks">
        <a href="index.html">Home</a>
        <a href="browse.html">Browse Items</a>
        <a href="report.html">Report Item</a>
        <a href="dashboard.html">Dashboard</a>
      </nav>
    </div>
  </header>

  <section class="page-head">
    <div class="container">
      <h1>Load demo data</h1>
      <p>Admin only. Saves the sample items to the database so the site looks complete.</p>
    </div>
  </section>

  <section class="section form-section">
    <div class="container narrow">
      <div class="form-card">
        <p id="seedMsg">Loading...</p>
        <button type="button" class="btn btn-primary btn-lg" id="seedBtn" hidden>Save demo items to database</button>
        <p style="margin-top:16px"><a class="item-link" href="browse.html">Go to Browse →</a></p>
      </div>
    </div>
  </section>

  <footer class="footer">
    <div class="container footer-inner">
      <div><strong>Campus Connect</strong> · Lost &amp; Found Portal</div>
      <div>
        Name: <strong>Aniket Saini</strong> ·
        Scholar No.: <strong>26U020017</strong> ·
        <strong>FoCP (CSE-1003)</strong>
      </div>
    </div>
  </footer>

  <script src="js/data.js"></script>
  <script type="module" src="js/firebase-store.js"></script>
  <script src="js/main.js"></script>
  <script>
    CCReady.then(function () {
      var msg = document.getElementById("seedMsg");
      var btn = document.getElementById("seedBtn");

      if (!CCStore.isSignedIn()) {
        msg.textContent = 'Step 1: click "Sign in with Google" in the menu at the top, using your admin Gmail.';
        return;
      }
      if (!CCStore.isAdmin()) {
        msg.textContent = "You are signed in, but this Gmail is not the admin account. Check ADMIN_EMAILS in js/firebase-store.js.";
        return;
      }
      msg.textContent = "Signed in as admin. The database currently holds " + SAMPLE_ITEMS.length + " items.";
      btn.hidden = false;
      btn.addEventListener("click", async function () {
        btn.disabled = true;
        btn.textContent = "Saving...";
        try {
          var n = await CCStore.seedDemo();
          msg.textContent = "Done. " + n + " demo items saved. Open Browse to see them.";
          btn.hidden = true;
        } catch (e) {
          msg.textContent = "Could not save: " + e.message + " (check the console, and that the Firestore rules are published).";
          btn.disabled = false;
          btn.textContent = "Try again";
        }
      });
    });
  </script>
</body>
</html>
